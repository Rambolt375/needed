- name: 1.1. Cek apakah Docker Engine sudah aktif
  shell: command -v docker
  register: docker_check
  failed_when: false
  changed_when: false

- name: 1.2. Install Prerequisit, Keyring, dan Paket Docker jika belum ada
  apt:
    name: [apt-transport-https, ca-certificates, curl, gnupg, lsb-release, git]
    state: present
    update_cache: yes
  when: docker_check.rc != 0

- name: 1.2b. Unduh GPG Key resmi Docker
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  when: docker_check.rc != 0

- name: 1.3. Tambahkan repositori resmi Docker
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
  when: docker_check.rc != 0

- name: 1.4. Eksekusi instalasi Docker runtime daemon
  apt:
    name:
      [
        docker-ce,
        docker-ce-cli,
        containerd.io,
        docker-compose-plugin,
        python3-docker,
      ]
    state: present
    update_cache: yes
  when: docker_check.rc != 0

- name: 1.5. Pastikan status layanan Docker hidup dan enabled
  service:
    name: docker
    state: started
    enabled: yes

- name: 1.6. Tambahkan user han ke dalam group docker
  user:
    name: han
    groups: docker
    append: yes

- name: 1.7. Force reset koneksi SSH agar group docker langsung aktif
  meta: reset_connection
