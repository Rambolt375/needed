- name: 3.1. Pastikan paket layanan HAProxy terinstall di OS lokal VM 1
  apt:
    name: haproxy
    state: present
    update_cache: yes

- name: 3.2. Buat direktori penyimpanan sertifikat SSL
  file:
    path: /etc/haproxy/ssl
    state: directory

- name: 3.3. Generate Self-Signed Certificate (.pem) untuk HAProxy
  shell: |
    openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    -keyout /etc/haproxy/ssl/parking.key \
    -out /etc/haproxy/ssl/parking.crt \
    -subj "/C=ID/ST=Jakarta/L=Jakarta/O=Sekolah/OU=IT/CN=parking-17.com"

    cat /etc/haproxy/ssl/parking.crt /etc/haproxy/ssl/parking.key > /etc/haproxy/ssl/parking.pem
  args:
    creates: /etc/haproxy/ssl/parking.pem

- name: 3.4. Generate file konfigurasi haproxy.cfg (Dengan SSL Termination)
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg

- name: 3.5. Restart dan aktifkan service HAProxy untuk menerapkan perubahan
  service:
    name: haproxy
    state: restarted
    enabled: yes
